<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KramaBench recorded run</title>
  <style>
    :root { color-scheme: light; color: #18243a; background: #f4f7fb; font: 100%/1.5 system-ui, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #142442; color: white; padding: 1.35rem max(1.1rem, calc((100% - 76rem) / 2)); }
    h1, h2, h3, p { margin: 0; }
    h1 { max-width: 58rem; font-size: clamp(1.35rem, 2.7vw, 2rem); line-height: 1.25; }
    h2 { font-size: 1.08rem; }
    h3 { font-size: .94rem; }
    small, dt, label { color: #52627a; }
    header small { display: block; color: #c1d0e8; margin: .35rem 0; }
    button, select { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .46; }
    button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid #3668b0; outline-offset: 2px; }
    main { max-width: 78.2rem; margin: auto; padding: 1.1rem; }
    .summary { display: grid; gap: .65rem; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 0 1rem; }
    .panel, .metric { background: white; border: 1px solid #d9e2ef; border-radius: .65rem; min-width: 0; }
    .metric { padding: .7rem .85rem; }
    .metric dt { font-size: .8rem; }
    .metric dd { margin: .14rem 0 0; font-weight: 650; overflow-wrap: anywhere; }
    .layout { display: grid; gap: 1rem; grid-template-columns: minmax(15rem, 23rem) minmax(0, 1fr); align-items: start; }
    .panel { padding: .9rem; }
    .controls, .step-heading, #votes { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .controls { margin: .55rem 0; }
    .controls button, select { color: inherit; background: white; border: 1px solid #a7bad2; border-radius: .35rem; padding: .25rem .45rem; font-size: .8rem; }
    label, #position { font-size: .77rem; }
    #timeline { list-style: none; margin: .55rem 0 0; padding: 0; max-height: 34rem; overflow: auto; }
    #timeline li + li { margin-top: .28rem; }
    .item { text-align: left; border: 1px solid transparent; border-radius: .35rem; padding: .32rem .46rem; width: 100%; background: #f4f7fb; color: inherit; display: block; }
    .item[aria-current="step"] { border-color: #8eafd4; background: #eaf2fc; }
    .item strong, .item small { display: block; overflow-wrap: anywhere; }
    .item strong { font-size: .86rem; }
    .item small { font-size: .73rem; }
    .badge { border-radius: .3rem; background: #e9eff9; color: #234f82; padding: .07rem .32rem; font-size: .72rem; font-weight: 650; }
    .badge[data-tag="RATIFY"], .badge[data-vote="confirmed"] { background: #e4f2eb; color: #16654b; }
    .badge[data-tag="REFUTE"], .badge[data-tag="REJECT"] { background: #f8ece6; color: #8a3d19; }
    .detail-text { overflow-wrap: anywhere; white-space: pre-wrap; margin-top: .45rem; }
    #claim-card { margin-top: .8rem; padding: .7rem .8rem; background: #f4f7fb; border-radius: .4rem; }
    #claim-value, #step-claim { font-weight: 650; }
    #votes { margin-top: .4rem; }
    #recovery-panel, details { margin-top: .65rem; padding-top: .65rem; border-top: 1px solid #d9e2ef; }
    #recovery-outcome { font-size: .88rem; overflow-wrap: anywhere; }
    summary { cursor: pointer; font-size: .86rem; font-weight: 650; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 23rem; overflow: auto; font-size: .77rem; background: #f4f7fb; border-radius: .35rem; padding: .55rem; }
    #evidence { margin: .35rem 0 0; padding-left: 1.25rem; overflow-wrap: anywhere; }
    #target { margin-top: .3rem; font-size: .8rem; color: #52627a; overflow-wrap: anywhere; }
    @media (max-width: 730px) {
      .layout { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #timeline { max-height: 13rem; }
    }
  </style>
</head>
<body>
  <header>
    <small>KramaBench · Recorded run</small>
    <h1 id="question">Benchmark task</h1>
    <small id="run-id"></small>
  </header>
  <main>
    <dl class="summary">
      <div class="metric"><dt>Run outcome</dt><dd id="outcome"></dd></div>
      <div class="metric"><dt>Final answer</dt><dd id="answer"></dd></div>
      <div class="metric"><dt>Independent grade</dt><dd id="grade"></dd></div>
      <div class="metric"><dt>Agreement reached</dt><dd id="agreement"></dd></div>
    </dl>
    <div class="layout">
      <nav class="panel" aria-label="Recorded timeline">
        <h2>Timeline</h2>
        <div class="controls">
          <button type="button" id="previous">Previous</button>
          <button type="button" id="play">Play</button>
          <button type="button" id="next">Next</button>
          <small id="position" aria-live="polite"></small>
        </div>
        <label for="filter">Show</label>
        <select id="filter">
          <option value="overview">Overview</option>
          <option value="discussion">Discussion</option>
          <option value="tools">Tools</option>
          <option value="recovery">Recovery</option>
          <option value="all">All recorded events</option>
        </select>
        <ol id="timeline"></ol>
      </nav>
      <article class="panel" aria-labelledby="step-title">
        <div class="step-heading">
          <h2 id="step-title"></h2>
          <span class="badge" id="branch"></span>
          <span class="badge" id="tag"></span>
        </div>
        <small id="who"></small>
        <p class="detail-text" id="step-claim"></p>
        <p class="detail-text" id="rationale"></p>
        <p id="target"></p>
        <ul id="evidence"></ul>
        <section id="claim-card">
          <h3>Leading claim at this step</h3>
          <p class="detail-text" id="claim-value"></p>
          <div id="votes" aria-label="Votes supporting this claim"></div>
        </section>
        <section id="recovery-panel">
          <h3>Recovery outcome</h3>
          <p id="recovery-outcome"></p>
        </section>
        <details id="raw-details">
          <summary>Raw event data</summary>
          <pre id="raw"></pre>
        </details>
      </article>
    </div>
  </main>
  <!-- BENCHMARK_TRACE_DATA -->
  <script>
    "use strict";
    const find = id => document.getElementById(id);
    const set = (id, value) => { find(id).textContent = value == null ? "" : String(value); };
    const pretty = value => String(value || "").replaceAll("_", " ");
    const {task, hardware, result, timeline, agents} = JSON.parse(find("recorded-data").textContent);
    const grade = result.grade || {};
    const recovery = result.recovery || {};
    const label = value => value == null ? "Not recorded" : value ? "Yes" : "No";
    set("question", task);
    set("run-id", [result.task_id, "attempt " + result.attempt_id.slice(0, 8), hardware].join(" · "));
    set("outcome", pretty(result.status) || "Not recorded");
    set("answer", result.output ?? "No final submission");
    set("grade", grade.status === "scored"
      ? (grade.correct ? "Correct" : "Incorrect") + " · " + grade.score
      : grade.status === "error" ? "Scoring failed" : "Ungraded");
    set("agreement", label(result.consensus));
    const recoveryEvents = timeline.filter(step => step.kind.startsWith("recovery_"));
    const recoveryEnd = [...recoveryEvents].reverse().find(step => step.kind === "recovery_finished")?.raw;
    const recoveryStatus = recoveryEnd?.status ?? recovery.status;
    const applied = recoveryEnd?.applied ?? recovery.applied;
    const confirmed = recoveryEnd?.confirmed ?? recovery.confirmed;
    const recoveryNote = recovery.mode === "disabled"
      ? "Disabled for this run."
      : recoveryEnd || recoveryStatus || recoveryEvents.length
        ? [pretty(recoveryStatus), applied == null ? "" : "Applied: " + label(applied),
          confirmed == null ? "" : "Confirmed: " + label(confirmed)].filter(Boolean).join(" · ")
        : "No recovery recorded.";
    set("recovery-outcome", recoveryNote || "Recovery events recorded.");

    const toolKinds = new Set(["tools_closed", "evidence_ready", "query_scope_mismatch"]);
    const belongs = (step, filter) => {
      if (filter === "all") return true;
      if (filter === "discussion") return step.kind === "contribution";
      if (filter === "tools") return step.kind.startsWith("tool_") || toolKinds.has(step.kind);
      if (filter === "recovery") return step.kind.startsWith("recovery_") ||
        (step.branch !== "main" && step.kind !== "model_response");
      return !["model_response", "tool_request_blocked"].includes(step.kind);
    };
    let items = timeline.filter(step => belongs(step, "overview"));
    let selected = 0;
    let timer = null;
    const list = find("timeline");

    function stopPlayback() {
      if (timer !== null) clearInterval(timer);
      timer = null;
      set("play", "Play");
    }
    function selectStep(index) {
      selected = index;
      const step = items[index];
      const currentButton = list.children[index]?.firstElementChild;
      for (const item of list.children) item.firstElementChild.removeAttribute("aria-current");
      if (currentButton) {
        currentButton.setAttribute("aria-current", "step");
        const row = currentButton.parentElement;
        const listBounds = list.getBoundingClientRect();
        const rowBounds = row.getBoundingClientRect();
        if (rowBounds.top < listBounds.top) list.scrollTop += rowBounds.top - listBounds.top;
        if (rowBounds.bottom > listBounds.bottom) list.scrollTop += rowBounds.bottom - listBounds.bottom;
      }
      find("previous").disabled = !step || index === 0;
      find("next").disabled = !step || index === items.length - 1;
      find("play").disabled = items.length < 2;
      set("position", step ? (index + 1) + " of " + items.length : "No events");
      set("step-title", step?.title || "No matching events");
      set("branch", step ? pretty(step.branch) : "");
      find("branch").hidden = !step;
      set("tag", step?.tag);
      find("tag").dataset.tag = step?.tag || "";
      find("tag").hidden = !step?.tag;
      set("who", [step?.agent, step?.time].filter(Boolean).join(" · "));
      set("step-claim", step?.claim);
      set("rationale", step?.rationale || step?.detail);
      const target = step?.target && timeline.find(entry =>
        entry.kind === "contribution" && entry.contribution_id === step.target);
      set("target", target ? "Responds to " + target.agent + ": " + target.claim :
        step?.target ? "Responds to " + step.target : "");
      find("evidence").replaceChildren(...(step?.evidence || []).map(content => {
        const line = document.createElement("li");
        line.textContent = String(content);
        return line;
      }));
      set("claim-value", step?.active_claim ?? "No leading claim recorded");
      find("votes").replaceChildren(...(step?.active_claim == null ? [] : agents.map(agent => {
        const vote = document.createElement("span");
        const ratified = step.ratifiers.includes(agent.name);
        vote.className = "badge";
        vote.dataset.vote = ratified ? "confirmed" : "pending";
        vote.textContent = agent.name + " · " + (ratified ? "ratified" : "pending");
        return vote;
      })));
      find("raw-details").hidden = !step;
      set("raw", step ? JSON.stringify(step.raw, null, 2) : "");
    }
    function buildTimeline() {
      list.replaceChildren(...items.map((step, index) => {
        const row = document.createElement("li");
        const button = document.createElement("button");
        const title = document.createElement("strong");
        const context = document.createElement("small");
        title.textContent = step.title;
        context.textContent = [step.agent, step.tag, step.branch].filter(Boolean).join(" · ");
        button.className = "item";
        button.type = "button";
        button.append(title, context);
        button.addEventListener("click", () => { stopPlayback(); selectStep(index); });
        row.append(button);
        return row;
      }));
      selectStep(0);
    }
    find("filter").addEventListener("change", event => {
      stopPlayback();
      items = timeline.filter(step => belongs(step, event.target.value));
      buildTimeline();
    });
    find("previous").addEventListener("click", () => { stopPlayback(); selectStep(selected - 1); });
    find("next").addEventListener("click", () => { stopPlayback(); selectStep(selected + 1); });
    find("play").addEventListener("click", () => {
      if (timer !== null) return stopPlayback();
      if (selected === items.length - 1) selectStep(0);
      set("play", "Pause");
      timer = setInterval(() => {
        if (selected >= items.length - 1) return stopPlayback();
        selectStep(selected + 1);
      }, 1200);
    });
    buildTimeline();
  </script>
</body>
</html>
