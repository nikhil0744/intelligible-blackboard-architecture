[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboard-agents"
version = "0.1.0"
description = "Intelligible Blackboard Architecture with Counterfactual Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
]
[tool.setuptools.packages.find]
include = ["contracts*", "blackboard*", "storage*", "counterfactual*", "sandbox*", "scheduler*", "agents*", "llm_broker*", "ingest*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
