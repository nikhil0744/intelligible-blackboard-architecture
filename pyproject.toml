[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboard-agents"
version = "0.1.0"
description = "Intelligible Blackboard Architecture with Counterfactual Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]
litellm = ["litellm>=1.40.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["contracts*", "blackboard*", "storage*", "counterfactual*", "sandbox*", "scheduler*", "agents*", "llm_broker*", "ingest*", "prompts*", "streaming*", "analytics*", "benchmarks*", "fixtures*", "scripts*"]

[tool.setuptools.package-data]
prompts = ["personas.json"]
fixtures = ["sample_deadlocks.json"]
contracts = ["stubs/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
]
