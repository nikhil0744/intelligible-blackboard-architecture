name: Test Suite & Contract Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Pytest & Schema Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,litellm]"

      - name: Verify Contract Schema Export
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import json
          from contracts.export import export_schemas

          tracked = Path("src/contracts/stubs")
          with TemporaryDirectory() as directory:
              generated = Path(directory)
              export_schemas(generated)
              assert {p.name for p in generated.glob("*.json")} == {p.name for p in tracked.glob("*.json")}
              for path in generated.glob("*.json"):
                  assert json.loads(path.read_text()) == json.loads((tracked / path.name).read_text()), path.name
          PY

      - name: Run Pytest Suite
        run: |
          pytest -v
