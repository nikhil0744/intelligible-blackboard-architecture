name: Test Suite & Contract Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Pytest & Schema Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-s1.txt ]; then pip install -r requirements-s1.txt; fi
          if [ -f requirements-s2.txt ]; then pip install -r requirements-s2.txt; fi
          if [ -f requirements-s4.txt ]; then pip install -r requirements-s4.txt; fi

      - name: Verify Contract Schema Export
        run: |
          python -m contracts.export

      - name: Run Pytest Suite
        run: |
          pytest -v
